<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>AI Detector Alarm Dashboard</title>

    <!-- CSS 파일들 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/simplePagination.js/1.6/simplePagination.css"
    />

    <link rel="stylesheet" href="/static/css/fault_dashboard.css" />
    <link rel="stylesheet" href="/static/css/fault_dashboard_equip.css" />
    <link rel="stylesheet" href="/static/css/map_tooltip.css" />

    <!-- 로딩 화면 스타일 -->
    <style></style>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- D3.js 먼저 로드 (동기) -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- jQuery 로드 (동기) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplePagination.js/1.6/jquery.simplePagination.min.js"></script>

    <!-- AI Detector 모듈 -->
    <script type="module">
      console.log('🚀 AI Detector 모듈 시스템 시작...');

      // 🔧 모듈 스코프 변수 선언 (window 객체 사용 최소화)
      let faultDashboardApp;
      let MessageManager;

      // 현재 시간 기준으로 시작/종료 시간 설정 함수
      const setupDefaultDateTime = () => {
        try {
          const now = new Date();
          const thirtyMinutesAgo = new Date(now.getTime() - 30 * 60 * 1000);

          // datetime-local 입력을 위한 포맷팅
          const formatDate = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');

            return `${year}-${month}-${day}T${hours}:${minutes}`;
          };

          // 디폴트 시간 설정
          const startDateTime = document.getElementById('startDateTime');
          const endDateTime = document.getElementById('endDateTime');

          if (startDateTime) {
            startDateTime.value = formatDate(thirtyMinutesAgo);
          }

          if (endDateTime) {
            endDateTime.value = formatDate(now);
          }

          console.log('✅ 디폴트 시간 설정 완료:', {
            시작시간: formatDate(thirtyMinutesAgo),
            종료시간: formatDate(now),
          });
        } catch (error) {
          console.error('❌ 디폴트 시간 설정 실패:', error);
        }
      };

      // 모듈 로딩
      async function initializeSystemSafely() {
        try {
          const dashboardContainer = document.getElementById('dashboard');
          const loadingOverlay = document.getElementById('loading-overlay');

          console.log('MessageManager 모듈 로딩...');

          const messageModule = await import('/static/js/utils/MessageManager.js');

          MessageManager = messageModule.default; // MessageManager 클래스
          console.log('✅ MessageManager 클래스 로드 완료');

          console.log('메인 애플리케이션 FaultDashboardApp 로딩...');
          const module = await import('/static/js/core/FaultDashboardApp.js');

          faultDashboardApp = module.faultDashboardApp; // 인스턴스 가져오기
          console.log('✅ faultDashboardApp 로드 완료');

          // AnalysisInterruption 로딩
          console.log('AnalysisInterruption 모듈 로딩...');
          await import('/static/js/core/AnalysisInterruption.js');
          console.log('✅ AnalysisInterruption 로딩 완료');

          // 🔧 초기 시간 설정 (앱 초기화 전에 먼저 설정)
          setupDefaultDateTime();

          // 초기화
          await faultDashboardApp.initialize();

          console.log('✅ 메인 애플리케이션 FaultDashboardApp 초기화 완료');

          // 로딩 화면 제거
          if (loadingOverlay) {
            loadingOverlay.classList.add('fade-out');
            setTimeout(() => {
              loadingOverlay.remove();
            }, 500);
          }

          if (dashboardContainer) {
            dashboardContainer.classList.remove('loading');
          }

          // 이벤트 리스너 설정 (모듈 스코프에서 직접 처리)
          setupEventListeners();
        } catch (error) {
          const loadingOverlay = document.getElementById('loading-overlay');
          if (loadingOverlay) {
            loadingOverlay.classList.add('fade-out');
            setTimeout(() => {
              loadingOverlay.remove();
            }, 500);
          }

          console.error('❌ 메인 애플리케이션 FaultDashboardApp 초기화 실패:', error);

          // 상세 오류 정보
          console.error('오류 상세:', {
            message: error.message,
            stack: error.stack,
            name: error.name,
          });

          // 사용자 알림
          alert(`시스템 초기화 실패: ${error.message}\n\n페이지를 새로고침해주세요.`);
        }
      }

      // 이벤트 리스너 설정 함수
      function setupEventListeners() {
        // 경보 수집 버튼 클릭 이벤트
        const faultQueryBtn = document.getElementById('fault-query-btn');
        if (faultQueryBtn) {
          faultQueryBtn.addEventListener('click', async function () {
            try {
              console.log('📊 경보 수집 버튼 클릭됨');

              // 시작일시와 종료일시 유효성 검사
              const startDateTime = document.getElementById('startDateTime').value;
              const endDateTime = document.getElementById('endDateTime').value;

              // 시작일시와 종료일시가 모두 입력되었는지 확인
              if (!startDateTime || !endDateTime) {
                alert('시작일시와 종료일시를 모두 입력해주세요.');
                return;
              }

              // 시작일시가 종료일시보다 늦지 않은지 확인
              const startDate = new Date(startDateTime);
              const endDate = new Date(endDateTime);

              if (startDate > endDate) {
                alert(
                  '시작일시는 종료일시보다 늦을 수 없습니다.\n\n시작일시를 종료일시보다 더 빠른 일시로 설정해주세요.'
                );
                return;
              }

              // 로딩 화면 표시
              const loadingOverlay = document.createElement('div');
              loadingOverlay.id = 'loading-overlay';
              loadingOverlay.innerHTML = `<div class="loading-spinner"></div><div class="loading-text">경보 데이터 수집 중...</div>`;
              document.body.appendChild(loadingOverlay);

              // 모듈이 준비되었는지 확인
              if (!faultDashboardApp) {
                console.error('❌ faultDashboardApp이 아직 로드되지 않았습니다.');
                alert('시스템이 아직 완전히 로드되지 않았습니다. 잠시 후 다시 시도해주세요.');
                loadingOverlay.remove();
                return;
              }

              await faultDashboardApp.loadAlarmData();

              MessageManager.addSuccessMessage('✅ 경보 데이터 수집을 완료했습니다.');

              // 로딩 화면 제거
              loadingOverlay.classList.add('fade-out');
              setTimeout(() => {
                loadingOverlay.remove();
              }, 500);
            } catch (error) {
              console.error('경보 데이터 수집 중 오류 발생:', error);

              // 로딩 화면 제거
              const loadingOverlay = document.getElementById('loading-overlay');
              if (loadingOverlay) {
                loadingOverlay.remove();
              }

              // MessageManager 정적 메서드 직접 사용
              MessageManager.addErrorMessage('경보 데이터 수집 중 오류가 발생했습니다.');
            }
          });
        }
      }

      // 시스템 초기화 실행
      await initializeSystemSafely();

      console.log('📋 기본 스크립트 로드 완료');
    </script>
  </head>

  <body>
    <!-- 로딩 화면 -->
    <div id="loading-overlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">AI Detector 시스템 로딩 중...</div>
    </div>

    <!-- 상단 헤더 영역 -->
    <div class="top-header">
      <div class="header-left">
        <button id="hamburger-btn" class="hamburger-btn">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="header-title" onclick="location.reload();" style="cursor: pointer">
          AI Detector
          <!-- <img src="/static/images/ai-detector.png" class="ai-detector-icon" /> -->
        </div>
      </div>

      <div class="header-center">
        <div class="chatbot-links">
          <a
            href="https://m365.cloud.microsoft/apps/?templatedAppId=9e2962b8-7eae-4124-86f3-1799090725e1&templateInstanceId=99ce7407-3842-4421-a54a-6675dd94b695&environment=Default-e6c9ec09-8430-4a99-bf15-242bc089b409&source=embedded-builder"
            class="chatbot-link"
            id="fault_case_chatbot"
            target="_blank"
          >
            <img src="/static/images/copilot_image.png" alt="챗봇 아이콘" class="chatbot-icon" />
            &nbsp;장애사례 챗봇 Agent
          </a>

          <a
            href="https://teams.microsoft.com/l/app/f6405520-7907-4464-8f6e-9889e2fb7d8f?templateInstanceId=06b26725-590a-4bc4-8c27-a65f1b2829e5&environment=Default-e6c9ec09-8430-4a99-bf15-242bc089b409"
            class="chatbot-link"
            id="island_info_chatbot"
            class="chatbot-link"
            id="island_info_chatbot"
            target="_blank"
          >
            <img src="/static/images/copilot_image.png" alt="챗봇 아이콘" class="chatbot-icon" />
            &nbsp;도서 시설조회 Apps
          </a>
        </div>
      </div>

      <div class="header-right">
        <!-- 전체 현황 요약 라인 -->
        <div class="header-summary">
          <span>경보장비</span><span id="realtime-alarm-equip-count">0 대</span>
          <span>| &nbsp;전체 경보</span><span id="total-alarm-count">0 건</span>
          <span>| &nbsp;최근 경보</span><span id="recent-alarm-update-time"> -</span>
          <!-- 우상단에 장비/국사 기준 메뉴 -->

          <span class="summary-title">| &nbsp;MAP 선택</span>
          <button id="equip-view-btn" class="view-btn active">장비 기준</button>
          <button id="guksa-view-btn" class="view-btn">국사 기준</button>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="left-sidebar">
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span class="default-title">대상 국사 </span>
            <span style="cursor: pointer; font-size: 10pt" onclick="location.reload();"
              >Refresh ⟳</span
            >
          </div>
          <div>
            <select id="searchGuksa">
              <option value="">전체 국사</option>
            </select>
          </div>
        </div>

        <!-- 경보발생 일시 선택 -->
        <div>
          <label class="default-title">경보발생 일시</label>
          <input type="datetime-local" id="startDateTime" class="form-control" />
          <br />
          <input type="datetime-local" id="endDateTime" class="form-control" />
        </div>
        <div class="mt-3">
          <button id="fault-query-btn" class="fault-query-btn">통합 경보 조회</button>
        </div>
        <div>
          <label class="default-title">경보 장비 선택</label>
          <div class="radio-group" id="searchNWType">
            <label><input type="radio" name="sector" value="MW" /> MW</label>
            <label><input type="radio" name="sector" value="선로" /> 선로</label>
            <label><input type="radio" name="sector" value="전송" checked /> 전송</label>
            <label><input type="radio" name="sector" value="IP" /> IP</label>
            <label><input type="radio" name="sector" value="무선" /> 무선</label>
            <label><input type="radio" name="sector" value="교환" /> 교환</label>
          </div>
        </div>
        <div>
          <!-- 경보발생 장비 검색 필터 -->
          <div class="equip-filter-container">
            <input
              type="text"
              id="equipFilterInput"
              class="equip-filter-input"
              placeholder="🔍 장비명 검색..."
            />
            <div class="equip-filter-div">
              <button id="equipFilterBtn" class="filter-btn">Filter</button>
              <button id="equipResetBtn" class="filter-btn">Reset</button>
            </div>
          </div>

          <!-- 경보발생 장비 목록 -->
          <div>
            <select id="searchEquipName" class="equip-select" size="15" tabindex="0"></select>
          </div>
        </div>
        <br />
        <button id="fault-point-btn" class="fault-view-btn">장애점 찾기</button>
      </div>

      <!-- right-content 영역 -->
      <div class="right-content">
        <div class="top-dashboard">
          <div
            id="dashboard"
            class="draggable-container loading"
            style="display: flex; flex-direction: row; flex-wrap: nowrap; overflow-x: auto"
          ></div>
        </div>

        <!-- 맵-채팅 분할 영역 -->
        <div class="horizontal-split-area">
          <!-- 좌측: 맵 영역 -->
          <div class="left-map-panel">
            <div class="new-map-container" id="map-container">
              <!-- 맵 로딩 스피너 -->
              <div id="map-loading-spinner" class="map-loading-spinner" style="display: none">
                <div class="map-spinner">
                  <div class="spinner-ring"></div>
                  <div class="spinner-text">토폴로지 로딩 중...</div>
                </div>
              </div>

              <!-- 여기에 d3.js 맵이 추가될 예정 -->
            </div>
          </div>

          <!-- 우측: 채팅 결과 영역 -->
          <div class="right-chat-panel">
            <div class="chat-messages-container" id="chat-messages-area" tabindex="0">
              <div class="chat-message system">
                <div class="message-content">
                  💡 장애점 찾기를 클릭하면 AI 분석 결과가 여기에 표시됩니다.
                </div>
                <div class="message-time">00:00</div>
              </div>
            </div>
            <div class="chat-input-container">
              <input type="text" id="chat-input" placeholder="질문을 입력하세요..." />
              <button id="chat-send-btn">전송</button>
            </div>
          </div>
        </div>

        <!-- 테이블 영역 (기존 유지) -->
        <div class="bottom-div">
          <div class="table-container" tabindex="0">
            <table id="alarmTable" class="alarm-table">
              <thead>
                <tr>
                  <th>| 국사</th>
                  <th>| 분야</th>
                  <th>| 유효</th>
                  <th>| 발생시간</th>
                  <th>| 장비ID</th>
                  <th>| 장비유형</th>
                  <th>| 장비명</th>
                  <th>| 경보내용</th>
                </tr>
              </thead>
              <tbody id="alarmTableBody"></tbody>
            </table>
          </div>

          <!-- <div id="pagination"></div> -->
        </div>
      </div>
    </div>

    <!-- 기본 이벤트 리스너 설정 -->
    <script>
      // 오류 추적 및 디버깅
      window.addEventListener('error', function (e) {
        console.error('🚨 전역 오류 감지:', {
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          colno: e.colno,
          error: e.error,
        });
      });

      window.addEventListener('unhandledrejection', function (e) {
        console.error('🚨 처리되지 않은 Promise 거부:', e.reason);
      });

      console.log('📋 기본 스크립트 로드 완료');

      $(document).ready(function () {
        console.log('🎯 jQuery 준비 완료');

        // 이 부분은 모듈 스코프에서 처리하므로 제거
      });
    </script>
  </body>
</html>
