<!-- fault_detector.html 수정 -->
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>AI Detector A-RAG</title>
    <link rel="stylesheet" href="/static/css/fault_detector.css" />
    <script src="/static/js/marked.min.js"></script>
    <script src="/static/js/fault_detector.js" defer></script>
  </head>

  <body>
    <div class="container">
      <div class="sidebar" id="summary-list">
        <!-- 질문 요약 항목이 여기에 동적으로 추가됨 -->
      </div>

      <div class="drag-handle" id="drag-handle">
        <div class="toggle-btn" id="toggle-btn"></div>
      </div>

      <div class="main">
        <div class="content-area">
          <div id="response-box"></div>
        </div>

        <div class="input-container">
          <div class="input-top">
            <div style="flex-shrink: 0">
              • 선택 장비:
              <span id="equip_id">[{{ sector }}] {{ equip_id }} (국사:{{ guksa_name }})</span>
            </div>

            <div style="display: flex; align-items: center; gap: 10px">
              <button class="ai-search-btn" id="getCableBtn" disabled>선로장애 확인</button>
              <button class="ai-search-btn" id="getMWInfoBtn" disabled>정전/페이딩 확인</button>
              <button class="ai-search-btn" id="clearChatBtn">대화 초기화</button>
            </div>
          </div>

          <div>
            <textarea
              id="prompt-input"
              placeholder="장애점을 찾을 수 있도록 현재 장애 증상과 분야별 경보를 입력해 주세요..."
            >
            </textarea>

            <button class="send-button" id="sendBtn">↑</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 서버에서 전달받은 경보 데이터
      window.faultData = {{ fault_data | tojson | safe }};
      console.log("🎯 window.faultData 설정 완료:", window.faultData);

      // 페이지 로드 시 AI 모델 초기화 상태 확인 및 대기
      document.addEventListener('DOMContentLoaded', function() {
        console.log("🔍 AI 모델 초기화 상태 확인 중...");

        checkAiModelStatus();
      });

      function checkAiModelStatus() {
        fetch('/api/initialization_status', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
          }
        })
        .then(response => response.json())
        .then(data => {
          if (data.success && data.status) {
            const status = data.status;
            const llm = status.llm;
            const vectordb = status.vectordb;

            // LLM 상태 출력
            if (llm.initialized) {
              console.log("✅ LLM 모델 초기화 완료");
            } else if (llm.initializing) {
              console.log("⏳ LLM 모델 초기화 진행 중...");
            } else if (llm.error) {
              console.warn("⚠️ LLM 모델 초기화 오류:", llm.error);
            } else {
              console.log("🔄 LLM 모델 아직 초기화 안됨");
            }

            // 벡터DB 상태 출력
            if (vectordb.initialized) {
              console.log("✅ 벡터DB 초기화 완료");
            } else if (vectordb.initializing) {
              console.log("⏳ 벡터DB 초기화 진행 중...");
            } else if (vectordb.error) {
              console.warn("⚠️ 벡터DB 초기화 오류:", vectordb.error);
            } else {
              console.log("🔄 벡터DB 아직 초기화 안됨");
            }

            // 전체 상태 확인
            if (status.all_initialized) {
              console.log("🎉 모든 AI 모델 초기화 완료 - 서비스 사용 가능!");
            } else if (status.any_initializing) {
              console.log("⏳ AI 모델 초기화 진행 중... 2초 후 다시 확인");
              setTimeout(checkAiModelStatus, 2000);
            } else {
              console.log("🔄 일부 AI 모델 초기화 필요 - 수동 초기화 시도");
              initializeVectorDbManually();
            }
          } else {
            console.warn("⚠️ AI 모델 상태 확인 실패, 수동 초기화 시도");
            initializeVectorDbManually();
          }
        })
        .catch(error => {
          console.error("❌ AI 모델 상태 확인 오류:", error);
          initializeVectorDbManually();
        });
      }

      function initializeVectorDbManually() {
        console.log("🚀 벡터DB 수동 초기화 시작...");

        fetch('/api/initialize_vectordb', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          }
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            console.log("✅ 벡터DB 수동 초기화 완료!");
          } else {
            console.warn("⚠️ 벡터DB 수동 초기화 실패:", data.message);
          }
        })
        .catch(error => {
          console.error("❌ 벡터DB 수동 초기화 오류:", error);
        });
      }
    </script>
  </body>
</html>
